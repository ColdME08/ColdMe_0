<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COLDME — Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="admin-page">

    <div class="admin-box">

      <p class="kicker">COLDME / ADMIN</p>

      <h1>Welcome back.</h1>

      <p class="admin-subtitle">
        Manage your letters, memories, and journey.
      </p>

      <div class="admin-actions">

        <button id="new-post-btn">
          + NEW POST
        </button>

        <button id="logout-btn" class="secondary-button">
          LOG OUT
        </button>

      </div>

      <section class="posts-section">

        <h2>YOUR POSTS</h2>

        <div id="posts-list">
          <p>Loading posts...</p>
        </div>

      </section>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="dashboard.js?v=3"></script>

</body>
</html>
