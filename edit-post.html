<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>COLDME — Edit Post</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="admin-page">

    <div class="admin-box">

      <p class="kicker">
        COLDME / EDIT POST
      </p>

      <h1>
        Edit something.
      </h1>

      <p class="admin-subtitle">
        Change your letter, journal entry, or memory.
      </p>


      <form id="edit-form">


        <label for="post-type">
          TYPE
        </label>

        <select id="post-type" required>

          <option value="Letter">
            Letter
          </option>

          <option value="Journal">
            Journal
          </option>

          <option value="Memory">
            Memory
          </option>

        </select>


        <label for="post-title">
          TITLE
        </label>

        <input
          type="text"
          id="post-title"
          required>


        <label for="post-content">
          CONTENT
        </label>

        <textarea
          id="post-content"
          rows="12"
          required></textarea>


        <button type="submit">
          SAVE CHANGES
        </button>


        <button
          type="button"
          id="cancel-btn"
          class="secondary-button">

          CANCEL

        </button>


        <p id="edit-message"></p>


      </form>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="edit-post.js"></script>

</body>

</html>
